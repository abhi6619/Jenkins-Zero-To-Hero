apiVersion: apps/v1
kind: Deployment

metadata:
  name: vintage-car-booking
  namespace: vintage-car

spec:
  replicas: 2

  selector:
    matchLabels:
      app: vintage-car-booking

  template:
    metadata:
      labels:
        app: vintage-car-booking

    spec:
      containers:

        - name: vintage-car-booking

          image: abhi7677/vintage-car-booking:1

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
